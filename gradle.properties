org.gradle.jvmargs=-Xmx3G -Duser.language=en -Duser.country=US -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Gradle 自动探测 JDK 只看当前 JVM、PATH、SDKMAN 和注册表，不看 JAVA_HOME；
# 微软的 JDK 装在 Program Files\Microsoft 下，也不在它默认扫的目录里。
# VS Code 的 Gradle 按钮用自己的 JRE（25）起 daemon，build.gradle 里的 java.toolchain 21 就找不到，
# createMinecraftArtifacts 直接报 "Cannot find a Java installation ... languageVersion=21"。
# 这条让探测也读环境变量里的 JAVA_HOME（变量不存在时静默忽略，CI 上没影响）
org.gradle.java.installations.fromEnv=JAVA_HOME

