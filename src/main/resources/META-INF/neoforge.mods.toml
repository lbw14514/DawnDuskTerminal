modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "twilightforest"
type = "required"
versionRange = "[1.21.1,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "geckolib"
type = "required"
versionRange = "[4.9.3,)"
ordering = "AFTER"
side = "BOTH"

# c2me 以 JarJar 嵌套随本模组加载；这条 optional 依赖给外部安装留出版本协商依据
[[dependencies.${mod_id}]]
modId = "c2me"
type = "optional"
versionRange = "[0.4.0-alpha.0.123,)"
ordering = "AFTER"
side = "BOTH"

[[mixins]]
config = "dawnduskterminal.mixins.json"
