plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            gameDirectory = project.file('run/client')
        }
        server {
            server()
            gameDirectory = project.file('run/server')
            programArguments.addAll '--nogui'
        }
        data {
            data()
            gameDirectory = project.file('run/data')
            programArguments.addAll '--mod', mod_id, '--all', '--output', project.file('src/generated/resources').absolutePath, '--existing', project.file('src/main/resources').absolutePath
        }
        gameTestServer {
            type = "gameTestServer"
            gameDirectory = project.file('run/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            programArguments.addAll '--nogui'
        }
    }

    mods {
        "dawnduskterminal" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenLocal()
}

def twilightDependency = providers.gradleProperty('twilight_dependency').getOrElse('required')
def twilightFile = file("libs/twilightforest-1.21.1.jar")

if (twilightFile.exists()) {
    dependencies {
        compileOnly files(twilightFile)
        runtimeOnly files(twilightFile)
    }
}

if (!twilightFile.exists()) {
    logger.lifecycle("DawnDuskTerminal: libs/twilightforest-1.21.1.jar not found, the mod will build without a compile time dependency on Twilight Forest")
}

def replaceProperties = [
    minecraft_version      : minecraft_version,
    minecraft_version_range: minecraft_version_range,
    neo_version            : neo_version,
    neo_version_range      : neo_version_range,
    loader_version_range   : loader_version_range,
    mod_id                 : mod_id,
    mod_name               : mod_name,
    mod_license            : mod_license,
    mod_version            : mod_version,
    mod_authors            : mod_authors,
    mod_description        : mod_description,
    twilight_dependency    : twilightDependency,
]

tasks.named('processResources', ProcessResources).configure {
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs << '-Xlint:deprecation'
}

jar {
    manifest {
        attributes([
            'Specification-Title'   : mod_id,
            'Specification-Vendor'  : mod_authors,
            'Specification-Version' : '1',
            'Implementation-Title'  : mod_name,
            'Implementation-Version': mod_version,
            'Implementation-Vendor' : mod_authors,
        ])
    }
}
