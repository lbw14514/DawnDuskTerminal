plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            gameDirectory = project.file('run/client')
        }
        server {
            server()
            gameDirectory = project.file('run/server')
            programArguments.addAll '--nogui'
        }
        data {
            data()
            gameDirectory = project.file('run/data')
            programArguments.addAll '--mod', mod_id, '--all', '--output', project.file('src/generated/resources').absolutePath, '--existing', project.file('src/main/resources').absolutePath
        }
        gameTestServer {
            type = "gameTestServer"
            gameDirectory = project.file('run/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            programArguments.addAll '--nogui'
        }
    }

    mods {
        "dawnduskterminal" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    // GeckoLib 的坐标只存在于它自己的 maven，用 exclusiveContent 把这一组从其余源里摘出来：
    // ModDevGradle 会把 maven.neoforged.net 加进仓库列表，而那个源在部分网络下连不上（连接超时），
    // 只要 Gradle 去问过它一次，整个 compileClasspath 解析就会失败
    exclusiveContent {
        forRepository {
            maven {
                name = 'GeckoLib'
                url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
            }
        }
        filter { includeGroup 'software.bernie.geckolib' }
    }
    // 暮色森林只有 CurseMaven 一条路：它自己的 modmaven 停更在 2024-07-06（最新 4.5.2428），
    // 1.21.1 现在用的 4.8.3345 在那个源上只有空目录。同样是第三方源，同样用 exclusiveContent 摘出来
    exclusiveContent {
        forRepository {
            maven {
                name = 'CurseMaven'
                url = 'https://www.cursemaven.com'
            }
        }
        filter { includeGroup 'curse.maven' }
    }
    // JEI 与 Xaero 同此，它们只在自己的源上
    // net.mezzdev.config 是 JEI 自己的传递依赖（配置界面那一套），也在同一个源
    exclusiveContent {
        forRepository {
            maven {
                name = 'BlameJared'
                url = 'https://maven.blamejared.com'
            }
        }
        filter {
            includeGroup 'mezz.jei'
            includeGroup 'net.mezzdev.config'
        }
    }
    // Xaero 的组是 xaero.minimap xaero.map xaero.lib，用正则一把抓
    exclusiveContent {
        forRepository {
            maven {
                name = 'ChocolateMinecraft'
                url = 'https://chocolateminecraft.com/maven/'
            }
        }
        filter { includeGroupByRegex 'xaero\\..*' }
    }
    // Jade Chunky Zume Tweakerge MaFgLib 都在 Modrinth 上，坐标是 maven.modrinth 加项目 slug 加版本号
    // 它的 pom 只有元信息，不带依赖，所以 Tweakerge 要的前置 MaFgLib 得自己写一条
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup 'maven.modrinth' }
    }
    mavenLocal()
}

// 开发时给 runClient 单独挂的客户端模组：JEI 看配方，拼音搜索给它加中文检索，Xaero 两个是地图，
// Jade 看方块信息，Chunky 预生成区块，Zume 缩放，Tweakerge 提供 tweak（前置 MaFgLib）
// 不能挂 run 的 additionalRuntimeClasspath：那只进 legacyClasspath.txt，FML 不当模组扫，游戏里看不见
// 也不能挂工程 runtimeOnly：那样 runServer runData runGameTestServer 也会带上
configurations {
    clientDevMods {
        canBeConsumed = false
    }
    // 只用来取 c2me 原始 jar，打补丁后再 JarJar，不进编译或运行 classpath
    c2meCompat {
        canBeConsumed = false
        canBeResolved = true
    }
}

// 专用服对照证明官方 c2me 的地形高度与不装 c2me 逐字节一致，开发环境那 15 列差是 dev 侧
// classpath 组合造成的假阳性，所以这里保留全部模块，只把 jar 嵌进产物
def c2meRemovedModules = []
// JarJar 元数据只写 mod 版本，加载器后缀 +1.21.1 不进 range 和 artifactVersion
// 官方 c2me 自己的 metadata.json 也是这么写的
def c2meBundleVersion = c2me_version.split('\\+')[0]
def c2meBundleGroup = 'com.ishland.c2me'
def c2meBundleArtifact = 'c2me-neoforge'
def patchC2me = tasks.register('patchC2me') {
    def c2meJar = configurations.c2meCompat
    inputs.files(c2meJar)
    inputs.property('removed', c2meRemovedModules.join(','))
    def output = layout.buildDirectory.file('c2me/c2me-patched.jar')
    outputs.file(output)
    doLast {
        def source = c2meJar.singleFile
        def target = output.get().asFile
        target.parentFile.mkdirs()
        if (c2meRemovedModules.isEmpty()) {
            java.nio.file.Files.copy(source.toPath(), target.toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            logger.lifecycle("c2me bundled unmodified")
            return
        }
        def found = new HashSet<String>()
        def put = { out, name, bytes ->
            out.putNextEntry(new java.util.zip.ZipEntry(name))
            out.write(bytes)
            out.closeEntry()
        }
        new java.util.zip.ZipFile(source).withCloseable { zip ->
            new java.util.zip.ZipOutputStream(new FileOutputStream(target)).withCloseable { out ->
                def entries = zip.entries()
                while (entries.hasMoreElements()) {
                    def entry = entries.nextElement()
                    def name = entry.name
                    if (name == 'META-INF/jarjar/metadata.json') {
                        def json = new groovy.json.JsonSlurper().parse(zip.getInputStream(entry))
                        def kept = []
                        json.jars.each { jar ->
                            def artifact = jar.identifier.artifact
                            if (c2meRemovedModules.contains(artifact)) {
                                found.add(artifact)
                            } else {
                                kept.add(jar)
                            }
                        }
                        json.jars = kept
                        put(out, name, groovy.json.JsonOutput.toJson(json).getBytes('UTF-8'))
                    } else if (name.startsWith('META-INF/jars/')
                        && c2meRemovedModules.any { name.contains(it.replace('c2me-', '')) }) {
                        found.add(c2meRemovedModules.find { name.contains(it.replace('c2me-', '')) })
                    } else {
                        put(out, name, zip.getInputStream(entry).bytes)
                    }
                }
            }
        }
        def missing = c2meRemovedModules - found
        if (!missing.isEmpty()) {
            throw new GradleException("c2me jar did not contain ${missing}, update the patch list")
        }
        logger.lifecycle("c2me patched without ${c2meRemovedModules}")
    }
}

// 手写 JarJar 元数据，避免 ModDevGradle 的 jarJar 配置在配置期就去解析本地补丁 jar
def c2meJarJarMetadata = tasks.register('generateC2meJarJarMetadata') {
    def output = layout.buildDirectory.file('c2me/META-INF/jarjar/metadata.json')
    inputs.property('version', c2meBundleVersion)
    outputs.file(output)
    doLast {
        def file = output.get().asFile
        file.parentFile.mkdirs()
        def payload = """{
  "jars": [
    {
      "identifier": {
        "group": "${c2meBundleGroup}",
        "artifact": "${c2meBundleArtifact}"
      },
      "version": {
        "range": "[${c2meBundleVersion},)",
        "artifactVersion": "${c2meBundleVersion}"
      },
      "path": "META-INF/jars/${c2meBundleArtifact}-${c2meBundleVersion}.jar"
    }
  ]
}
"""
        file.setText(payload, 'UTF-8')
    }
}

// 两个前置模组都用 compileOnly 加 runtimeOnly：
// compileOnly 供编译，runtimeOnly 让 runClient runServer runData 这些开发运行也加载它们
// 它们都是普通模组，运行时必须装在游戏端，jar 不会被打进本模组的产物
dependencies {
    // c2me 本体打进 jar，保留官方全部模块；外部安装时由 FML 的 JarJar 协商处理
    c2meCompat "maven.modrinth:c2me-neoforge:${c2me_version}"

    // 4.9.3 是 1.21.1 线上当前的版本，它声明 neoforge >= 21.1.150，本项目满足
    // GeckoLib 另有一个 geckoanimfix 是 incompatible 依赖，两者不能同时装
    compileOnly "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
    runtimeOnly "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"

    // 坐标是「项目 id 加 file id」，7797302 对应 CurseForge 上 1.21.1 的 4.8.3345
    compileOnly 'curse.maven:the-twilight-forest-227639:7797302'
    runtimeOnly 'curse.maven:the-twilight-forest-227639:7797302'

    clientDevMods "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    clientDevMods "xaero.minimap:xaerominimap-neoforge-${minecraft_version}:${xaero_minimap_version}"
    clientDevMods "xaero.map:xaeroworldmap-neoforge-${minecraft_version}:${xaero_worldmap_version}"
    // 拼音搜索只有 CurseMaven，9163765 对应 1.21.1 的 4.5.30
    clientDevMods 'curse.maven:just-enough-characters-250702:9163765'

    // OpenYSM 是 Yes Steve Model 的开源分支，装进 runClient 是为了拿原始 Bedrock 动画对拍高塔恶魂的 GeckoLib 移植
    // 1.21.1 NeoForge 没有官方构建（官方的 CurseMaven 项目只发 1.20.1），只有第三方移植：CurseForge 项目 1587175
    // 8384243 对应 openysm-neoforge-1.21.1-2.6.6
    clientDevMods "curse.maven:openysm-unofficial-neoforge-port-1587175:${openysm_version}"

    // MaFgLib 是 Tweakerge 的前置，Modrinth 的 pom 传递不出来，只能显式加
    clientDevMods "maven.modrinth:mafglib:${mafglib_version}"
    clientDevMods "maven.modrinth:tweakerge:${tweakerge_version}"
    clientDevMods "maven.modrinth:jade:${jade_version}"
    // Chunky 的 1.4.23 在 Modrinth 上是 fabric forge neoforge 三条同版本号的文件，按版本号取会拿到 forge 那个
    // （FML 打日志 Skipping jar ... is for Minecraft Forge ... cannot be loaded 然后静默跳过）
    // 所以这里写 neoforge 那条的版本 id，对应 Chunky-NeoForge-1.4.23.jar
    clientDevMods "maven.modrinth:chunky:${chunky_version}"
    clientDevMods "maven.modrinth:zume:${zume_version}"
    // AppleSkin 看饱食度与食物回复，BoccHUD 看状态条，都是开发时看一眼的东西
    // BoccHUD 0.4.1 的必装前置就是 MaFgLib，不需要另写一条
    clientDevMods "maven.modrinth:appleskin:${appleskin_version}"
    clientDevMods "maven.modrinth:bocchud:${bocchud_version}"
}

// 把打过补丁的 c2me 作为嵌套 jar 打进产物，元数据手写
tasks.named('jar', Jar) {
    dependsOn patchC2me, c2meJarJarMetadata
    from(patchC2me) {
        into 'META-INF/jars'
        rename { "${c2meBundleArtifact}-${c2meBundleVersion}.jar" }
    }
    from(c2meJarJarMetadata) {
        into 'META-INF/jarjar'
    }
}

// run 的 classpath 在任务执行时才从 classpathProvider 取，所以要加在 provider 上，加 classpath 会被覆盖
tasks.named('runClient') { task ->
    task.classpathProvider.from(configurations.clientDevMods)
}

def twilightDependency = providers.gradleProperty('twilight_dependency').getOrElse('required')

def replaceProperties = [
    minecraft_version      : minecraft_version,
    minecraft_version_range: minecraft_version_range,
    neo_version            : neo_version,
    neo_version_range      : neo_version_range,
    loader_version_range   : loader_version_range,
    mod_id                 : mod_id,
    mod_name               : mod_name,
    mod_license            : mod_license,
    mod_version            : mod_version,
    mod_authors            : mod_authors,
    mod_description        : mod_description,
    twilight_dependency    : twilightDependency,
]

tasks.named('processResources', ProcessResources).configure {
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs << '-Xlint:deprecation'
}

jar {
    manifest {
        attributes([
            'Specification-Title'   : mod_id,
            'Specification-Vendor'  : mod_authors,
            'Specification-Version' : '1',
            'Implementation-Title'  : mod_name,
            'Implementation-Version': mod_version,
            'Implementation-Vendor' : mod_authors,
        ])
    }
}

// native 网格变换内核
// native 源码是纯 C++17 + std::thread，不含任何平台 API
// 用 Zig 做统一交叉编译：同一份工具链能出 windows / linux / macos 的 x86_64 与 aarch64
// 所以无论在哪个平台执行 gradlew build，jar 里都带全部五个平台的 native
// 任何一个目标编译失败或 Zig 下载失败都直接让构建失败，不产出残缺的 jar

def javaHome = System.getProperty('java.home')
def nativeSource = layout.projectDirectory.file('src/main/native/ddt_native.cpp')
def nativeOutput = layout.buildDirectory.dir('native')
def zigVersion = providers.gradleProperty('ddt_zig_version').getOrElse('0.13.0')
// native 与 Java 的 JNI 协议版本 必须与 NativeMesh.ABI_VERSION 同步 由 verifyNativeAbi 校验
def nativeAbiVersion = providers.gradleProperty('ddt_native_abi_version').getOrElse('1')
// Zig 工具链与它的缓存都装在 Gradle 用户目录下，不放工程目录
// 工程目录带 DSH 沙盒留下的目录权限项 在那里启动 zig 会在建编译临时目录时被拒
// （同一份二进制放到用户目录下就正常 与 Zig 版本无关） 顺带 clean 也不会把它删掉
def zigInstallRoot = new File(gradle.gradleUserHomeDir, 'ddt-zig')
def zigCacheRoot = new File(gradle.gradleUserHomeDir, 'ddt-zig-cache')
def zigDirectory = new File(zigInstallRoot, zigVersion)
def zigIsWindows = System.getProperty('os.name', '').toLowerCase(Locale.ROOT).contains('win')
def zigExecutable = new File(zigDirectory, zigIsWindows ? 'zig.exe' : 'zig')
// -O3 是 zig c++ 能接受的最高优化档（内部映射到 ReleaseFast）
// -s 让链接器去掉调试符号：Zig 默认给 ELF 写完整 DWARF，linux 的 .so 会从 2.7MB 掉到 260KB 左右
// 只去符号表，不碰动态符号，JNI 导出函数仍然可见
def nativeCompileFlags = ['-O3', '-std=c++17', '-s']

def nativeTargets = [
    'windows-x86_64': [triple: 'x86_64-windows-gnu',     lib: 'ddt_native.dll',     jni: 'win32', args: ['-shared']],
    'linux-x86_64'  : [triple: 'x86_64-linux-gnu.2.17',  lib: 'libddt_native.so',   jni: 'posix', args: ['-shared', '-fPIC']],
    'linux-aarch64' : [triple: 'aarch64-linux-gnu.2.17', lib: 'libddt_native.so',   jni: 'posix', args: ['-shared', '-fPIC']],
    'macos-x86_64'  : [triple: 'x86_64-macos',           lib: 'libddt_native.dylib', jni: 'posix', args: ['-dynamiclib']],
    'macos-aarch64' : [triple: 'aarch64-macos',          lib: 'libddt_native.dylib', jni: 'posix', args: ['-dynamiclib']],
]

def zigHostOs = System.getProperty('os.name', '').toLowerCase(Locale.ROOT)
def zigHostArch = System.getProperty('os.arch', '').toLowerCase(Locale.ROOT).contains('aarch64') ? 'aarch64' : 'x86_64'
def zigHostKey = zigHostOs.contains('win') ? 'windows' : (zigHostOs.contains('mac') ? 'macos' : 'linux')
def zigArchiveExtension = zigHostKey == 'windows' ? 'zip' : 'tar.xz'
// 包存在用户目录下而不是 build/ 或工程 .gradle/ 下：ziglang.org 只有 20KB/s 上下
// 79MB 的包要拉一小时 不能让 gradlew clean 或换工作副本把它删掉
// 工程内旧位置（.gradle/zig-downloads 与 build/tools）里的整包会被认下来并搬过来
def zigArchive = new File(new File(zigInstallRoot, 'downloads'), "zig-${zigVersion}-${zigHostKey}-${zigHostArch}.${zigArchiveExtension}")
def zigUrl = "https://ziglang.org/download/${zigVersion}/zig-${zigHostKey}-${zigHostArch}-${zigVersion}.${zigArchiveExtension}"
// 官方 index.json 里每个包的 shasum 下载后必须逐字节对上
// 换 ddt_zig_version 时要么把新版本的官方哈希补进这张表 要么显式传 -Pddt_zig_sha256=<hex>
// GString 不能直接当 Map 的字符串键用 必须落成 String 否则哈希相等性判不出来
def zigHost = "${zigHostKey}-${zigHostArch}".toString()
def zigKnownSha256 = [
    '0.13.0': [
        'windows-x86_64': 'd859994725ef9402381e557c60bb57497215682e355204d754ee3df75ee3c158',
        'linux-x86_64'  : 'd45312e61ebcc48032b77bc4cf7fd6915c11fa16e4aad116b66c9468211230ea',
        'linux-aarch64' : '041ac42323837eb5624068acd8b00cd5777dac4cf91179e8dad7a7e90dd0c556',
        'macos-x86_64'  : '8b06ed1091b2269b700b3b07f8e3be3b833000841bae5aa6a09b1a8b4773effd',
        'macos-aarch64' : '46fae219656545dfaf4dce12fb4e8685cec5b51d721beee9389ab4194d43394c',
    ],
]
def zigSha256Override = providers.gradleProperty('ddt_zig_sha256').getOrNull()
def zigSha256 = (zigKnownSha256[zigVersion]?.get(zigHost) ?: zigSha256Override)?.trim()?.toLowerCase(Locale.ROOT)

// 配置缓存不允许任务动作在执行期碰 layout，路径在配置期先落成普通 File
// zig 的缓存目录也放用户目录下，理由同上：工程目录里的权限项会让 zig 建临时文件被拒
def zigExecutableFile = zigExecutable
def zigDirectoryFile = zigDirectory
def zigArchiveFile = zigArchive
def zigGlobalCacheDirectory = new File(zigCacheRoot, 'global')
def zigLocalCacheDirectory = new File(zigCacheRoot, 'local')
// 工程内旧位置，整包存在时认下来，省掉一次一小时的下载
def zigLegacyArchiveFiles = [
    layout.projectDirectory.file(".gradle/zig-downloads/zig-${zigVersion}-${zigHostKey}-${zigHostArch}.${zigArchiveExtension}").asFile,
    layout.buildDirectory.file("tools/zig-${zigVersion}-${zigHostKey}-${zigHostArch}.${zigArchiveExtension}").get().asFile,
]
def nativeSourceFile = nativeSource.asFile
def nativeOutputDirectory = nativeOutput.get().asFile
def nativeWorkDirectory = layout.buildDirectory.dir('tools/native-work').get().asFile
def nativeJniDirectories = nativeTargets.collectEntries { key, target ->
    [(key): layout.projectDirectory.dir("src/main/native/${target.jni}").asFile]
}

// Zig 只有 ziglang.org 一个官方源，直连与走代理都只有 20KB/s 上下，79MB 的包断了是常态
// 所以下载要带断点续传 重试与完整性校验
// 旧实现直接把流拷进文件，连接被掐断时一个字都不报，直到 tar 解压才发现包是残的
def installZig = tasks.register('installZig') {
    description = '下载并解压编译 native 用的 Zig 工具链'
    onlyIf { !zigExecutableFile.exists() }
    inputs.property('zigVersion', zigVersion)
    inputs.property('zigHost', zigHost)
    inputs.property('zigUrl', zigUrl)
    inputs.property('zigSha256', zigSha256 ?: '')
    outputs.file(zigExecutable)
    doLast {
        if (zigSha256 == null) {
            throw new GradleException(
                "没有 Zig ${zigVersion} (${zigHost}) 的官方 SHA-256，拒绝下载未经校验的工具链\n" +
                "把 https://ziglang.org/download/index.json 里对应条目的 shasum 补进 build.gradle 的 zigKnownSha256\n" +
                "或者给本次构建传 -Pddt_zig_sha256=<hex>")
        }
        def archive = zigArchiveFile
        // 完整性校验要按包格式分开做：zip 看中央目录，tar.xz 看尾部 footer 的 "YZ" 魔数
        // 只按 zip 判定会让 linux 与 macOS 的 tar.xz 永远算不完整 下满后再续传只会得到 HTTP 416
        def archiveIsComplete = { File file ->
            if (!file.exists() || file.length() == 0L) {
                return false
            }
            if (file.name.endsWith('.zip')) {
                // 截断的 zip 会丢掉中央目录，ZipFile 打开即抛异常，正好当完整性校验用
                try {
                    new java.util.zip.ZipFile(file).withCloseable { zip -> zip.size() > 0 }
                    return true
                } catch (java.io.IOException ignored) {
                    return false
                }
            }
            long footerOffset = file.length() - 12L
            if (footerOffset < 0L) {
                return false
            }
            // xz 流尾部 footer 共 12 字节：CRC32(4) 反向大小(4) 流标志(2) 魔数 "YZ"(2)
            byte[] footer = new byte[12]
            new RandomAccessFile(file, 'r').withCloseable { raf ->
                raf.seek(footerOffset)
                raf.readFully(footer)
            }
            footer[10] == (byte) 0x59 && footer[11] == (byte) 0x5A
        }

        // 结构完整只能证明包没被截断 不能证明内容就是官方那份
        // 被替换过中间字节的压缩包照样能通过 zip 中央目录与 xz footer 检查
        def sha256Of = { File file ->
            def digest = java.security.MessageDigest.getInstance('SHA-256')
            file.withInputStream { stream ->
                byte[] buffer = new byte[65536]
                int read
                while ((read = stream.read(buffer)) != -1) {
                    digest.update(buffer, 0, read)
                }
            }
            digest.digest().collect { String.format('%02x', it & 0xff) }.join()
        }
        def archiveMatches = { File file ->
            archiveIsComplete(file) && sha256Of(file) == zigSha256
        }

        archive.parentFile.mkdirs()
        def adoptedFrom = zigLegacyArchiveFiles.find { archiveMatches(it) }
        if (!archiveMatches(archive) && adoptedFrom != null) {
            logger.lifecycle("接管 ${adoptedFrom} 下已下载完整的 Zig 包")
            java.nio.file.Files.copy(adoptedFrom.toPath(), archive.toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        }
        if (archiveMatches(archive)) {
            logger.lifecycle("复用已下载并通过 SHA-256 校验的 Zig 包（${archive.length()} 字节）")
        } else {
            archive.delete()
            long expected = -1L
            int attempts = 6
            for (int attempt = 1; attempt <= attempts; attempt++) {
                long have = archive.exists() ? archive.length() : 0L
                try {
                    def connection = new URL(zigUrl).openConnection()
                    connection.connectTimeout = 30000
                    connection.readTimeout = 180000
                    connection.setRequestProperty('User-Agent', 'DawnDuskTerminal Gradle build')
                    if (have > 0L) {
                        connection.setRequestProperty('Range', "bytes=${have}-")
                    }
                    def status = connection.getResponseCode()
                    if (status == 200 && have > 0L) {
                        logger.lifecycle('源站没按 Range 续传，从零重下')
                        archive.delete()
                        have = 0L
                    } else if (status == 416) {
                        // 续传起点越过文件尾：本地这份已经下满，校验通过就当完成
                        if (archiveMatches(archive)) {
                            logger.lifecycle("服务端拒绝续传（HTTP 416，本地 ${have} 字节），本地包已完整")
                            break
                        }
                        logger.lifecycle('服务端拒绝续传（HTTP 416），本地包不完整或校验不符，从零重下')
                        archive.delete()
                        throw new java.io.IOException('HTTP 416')
                    } else if (status != 200 && status != 206) {
                        throw new java.io.IOException("HTTP ${status}")
                    }
                    def length = connection.getHeaderField('Content-Length')?.toLong() ?: -1L
                    expected = length > 0L ? have + length : -1L
                    logger.lifecycle("下载 Zig ${zigVersion} (${zigHostKey}-${zigHostArch})" +
                        (have > 0L ? "，从 ${have} 字节续传" : '') +
                        (expected > 0L ? "，共 ${expected} 字节" : '') +
                        "，第 ${attempt}/${attempts} 次")
                    def output = new FileOutputStream(archive, have > 0L)
                    try {
                        connection.inputStream.withStream { input -> output << input }
                    } finally {
                        output.close()
                    }
                } catch (java.io.IOException e) {
                    logger.lifecycle("下载中断（当前 ${archive.exists() ? archive.length() : 0} 字节）：${e.message}")
                }
                if (archiveIsComplete(archive)) {
                    if (archiveMatches(archive)) {
                        break
                    }
                    logger.lifecycle("Zig 包结构完整但 SHA-256 与官方值不符，删除后重新下载")
                    archive.delete()
                }
                if (attempt < attempts) {
                    Thread.sleep(2000L * attempt)
                }
            }
            if (!archiveMatches(archive)) {
                throw new GradleException("下载 Zig ${zigVersion} 失败：${zigUrl}\n" +
                    "已下载的部分保留在 ${archive}，重跑会断点续传，不要删\n" +
                    "校验期望 SHA-256 ${zigSha256}，实际 ${archive.exists() ? sha256Of(archive) : '文件不存在'}\n" +
                    "走代理要在 ~/.gradle/gradle.properties 里写 systemProp.http(s).proxyHost 与 proxyPort\n" +
                    "国内网络可以从 PyPI 镜像取同一份工具链，比 ziglang.org 快两个数量级：\n" +
                    "  curl -L -o zig.whl https://pypi.tuna.tsinghua.edu.cn/simple/ziglang/ 里对应的 ziglang-${zigVersion}-py3-none-<平台>.whl\n" +
                    "  tar -xf zig.whl -C ${zigDirectoryFile} --strip-components=1\n" +
                    "解压到 ${zigDirectoryFile} 后 installZig 会自动跳过下载")
            }
            if (expected > 0L && archive.length() != expected) {
                logger.lifecycle("包大小 ${archive.length()} 与响应头的 ${expected} 不一致，但包结构完整，继续")
            }
        }
        if (!archiveMatches(archive)) {
            throw new GradleException("Zig 安装包 SHA-256 校验失败，拒绝解压 ${archive}")
        }
        zigDirectoryFile.mkdirs()
        // Windows 10 1803 之后自带 bsdtar，macOS 与 Linux 也都有 tar，zip 与 tar.xz 都能吃
        def extraction = new ProcessBuilder('tar', '-xf', archive.absolutePath, '-C', zigDirectoryFile.absolutePath,
            '--strip-components=1').redirectErrorStream(true).start()
        def extractionOutput = extraction.inputStream.getText('UTF-8')
        def extractionExit = extraction.waitFor()
        if (extractionExit != 0 || !zigExecutableFile.exists()) {
            throw new GradleException(
                "解压 Zig 失败（tar 退出码 ${extractionExit}）\n${extractionOutput}")
        }
    }
}

def buildNative = tasks.register('buildNative') {
    description = '用 Zig 交叉编译各平台 native 网格内核'
    dependsOn installZig
    inputs.file(nativeSource)
    inputs.files(layout.projectDirectory.dir('src/main/native/win32'),
        layout.projectDirectory.dir('src/main/native/posix'))
    inputs.property('targets', nativeTargets.keySet().join(','))
    inputs.property('compileFlags', nativeCompileFlags.join(' '))
    inputs.property('zigVersion', zigVersion)
    inputs.property('abiVersion', nativeAbiVersion)
    outputs.dir(nativeOutput)
    doFirst {
        // 目标集合可能变过，先清掉上一次的产物，避免旧平台的库混进 jar
        nativeOutputDirectory.deleteDir()
    }
    doLast {
        // 先编到临时目录再只拷回目标库，免得 zig 在 Windows 上顺带产出的 .lib / .pdb 被打进 jar
        def workDirectory = nativeWorkDirectory
        workDirectory.deleteDir()
        nativeTargets.each { key, target ->
            def buildDirectory = new File(workDirectory, key)
            buildDirectory.mkdirs()
            def builtLibrary = new File(buildDirectory, target.lib)
            def arguments = [zigExecutableFile.absolutePath, 'c++', '-target', target.triple]
            arguments.addAll(nativeCompileFlags)
            arguments.addAll(target.args)
            arguments.add("-DDDT_NATIVE_ABI_VERSION=${nativeAbiVersion}".toString())
            arguments.addAll([
                "-I${javaHome}/include".toString(),
                "-I${nativeJniDirectories[key].absolutePath}".toString(),
                nativeSourceFile.absolutePath,
                '-o',
                builtLibrary.absolutePath,
            ])
            logger.lifecycle("编译 native ${key} (${target.triple})")
            def compilation = new ProcessBuilder(arguments).redirectErrorStream(true)
            // 缓存目录显式指到用户目录：zig 默认把 .zig-cache 建在当前目录
            // 工程目录下建临时文件会被目录权限项拒掉，报 cache: manifest_create AccessDenied
            zigGlobalCacheDirectory.mkdirs()
            zigLocalCacheDirectory.mkdirs()
            compilation.environment().put('ZIG_GLOBAL_CACHE_DIR', zigGlobalCacheDirectory.absolutePath)
            compilation.environment().put('ZIG_LOCAL_CACHE_DIR', zigLocalCacheDirectory.absolutePath)
            def running = compilation.start()
            def compilationOutput = running.inputStream.getText('UTF-8')
            def exitCode = running.waitFor()
            if (exitCode != 0) {
                throw new GradleException(
                    "native 编译失败 ${key} (${target.triple})\n" + compilationOutput)
            }
            def outputDirectory = new File(nativeOutputDirectory, key)
            outputDirectory.mkdirs()
            builtLibrary.withInputStream { input ->
                new File(outputDirectory, target.lib).withOutputStream { output -> output << input }
            }
        }
        workDirectory.deleteDir()
    }
}

processResources {
    dependsOn buildNative
    from(nativeOutput) {
        into 'native'
        includeEmptyDirs = false
    }
}

// Java 侧 ABI 常量与编译 native 时用的版本必须来自同一个值
// 两者错开时运行期会拒绝加载 但不应该在发布前才发现
def verifyNativeAbi = tasks.register('verifyNativeAbi') {
    description = '校验 NativeMesh.ABI_VERSION 与 ddt_native_abi_version 一致'
    def javaSource = layout.projectDirectory.file('src/main/java/com/dawnduskterminal/client/NativeMesh.java')
    def javaFile = javaSource.asFile
    inputs.file(javaSource)
    inputs.property('abiVersion', nativeAbiVersion)
    doLast {
        def matcher = javaFile.getText('UTF-8') =~ /ABI_VERSION\s*=\s*(\d+)/
        def declared = matcher.find() ? matcher.group(1) : null
        if (declared != nativeAbiVersion.toString()) {
            throw new GradleException(
                "NativeMesh.ABI_VERSION=${declared} 与 ddt_native_abi_version=${nativeAbiVersion} 不一致")
        }
    }
}

tasks.named('check') {
    dependsOn verifyNativeAbi
}
