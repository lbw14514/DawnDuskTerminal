plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            gameDirectory = project.file('run/client')
        }
        server {
            server()
            gameDirectory = project.file('run/server')
            programArguments.addAll '--nogui'
        }
        data {
            data()
            gameDirectory = project.file('run/data')
            programArguments.addAll '--mod', mod_id, '--all', '--output', project.file('src/generated/resources').absolutePath, '--existing', project.file('src/main/resources').absolutePath
        }
        gameTestServer {
            type = "gameTestServer"
            gameDirectory = project.file('run/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            programArguments.addAll '--nogui'
        }
    }

    mods {
        "dawnduskterminal" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    // GeckoLib 的坐标只存在于它自己的 maven，用 exclusiveContent 把这一组从其余源里摘出来：
    // ModDevGradle 会把 maven.neoforged.net 加进仓库列表，而那个源在部分网络下连不上（连接超时），
    // 只要 Gradle 去问过它一次，整个 compileClasspath 解析就会失败
    exclusiveContent {
        forRepository {
            maven {
                name = 'GeckoLib'
                url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
            }
        }
        filter { includeGroup 'software.bernie.geckolib' }
    }
    // 暮色森林只有 CurseMaven 一条路：它自己的 modmaven 停更在 2024-07-06（最新 4.5.2428），
    // 1.21.1 现在用的 4.8.3345 在那个源上只有空目录。同样是第三方源，同样用 exclusiveContent 摘出来
    exclusiveContent {
        forRepository {
            maven {
                name = 'CurseMaven'
                url = 'https://www.cursemaven.com'
            }
        }
        filter { includeGroup 'curse.maven' }
    }
    // JEI 与 Xaero 同此，它们只在自己的源上
    // net.mezzdev.config 是 JEI 自己的传递依赖（配置界面那一套），也在同一个源
    exclusiveContent {
        forRepository {
            maven {
                name = 'BlameJared'
                url = 'https://maven.blamejared.com'
            }
        }
        filter {
            includeGroup 'mezz.jei'
            includeGroup 'net.mezzdev.config'
        }
    }
    // Xaero 的组是 xaero.minimap xaero.map xaero.lib，用正则一把抓
    exclusiveContent {
        forRepository {
            maven {
                name = 'ChocolateMinecraft'
                url = 'https://chocolateminecraft.com/maven/'
            }
        }
        filter { includeGroupByRegex 'xaero\\..*' }
    }
    // Jade Chunky Zume Tweakerge MaFgLib 都在 Modrinth 上，坐标是 maven.modrinth 加项目 slug 加版本号
    // 它的 pom 只有元信息，不带依赖，所以 Tweakerge 要的前置 MaFgLib 得自己写一条
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup 'maven.modrinth' }
    }
    mavenLocal()
}

// 开发时给 runClient 单独挂的客户端模组：JEI 看配方，拼音搜索给它加中文检索，Xaero 两个是地图，
// Jade 看方块信息，Chunky 预生成区块，Zume 缩放，Tweakerge 提供 tweak（前置 MaFgLib）
// 不能挂 run 的 additionalRuntimeClasspath：那只进 legacyClasspath.txt，FML 不当模组扫，游戏里看不见
// 也不能挂工程 runtimeOnly：那样 runServer runData runGameTestServer 也会带上
configurations {
    clientDevMods {
        canBeConsumed = false
    }
    // 只用来取 c2me 原始 jar，打补丁后再 JarJar，不进编译或运行 classpath
    c2meCompat {
        canBeConsumed = false
        canBeResolved = true
    }
}

// 专用服对照证明官方 c2me 的地形高度与不装 c2me 逐字节一致，开发环境那 15 列差是 dev 侧
// classpath 组合造成的假阳性，所以这里保留全部模块，只把 jar 嵌进产物
def c2meRemovedModules = []
def c2meBundleVersion = '0.4.0-alpha.0.123.1'
def c2meBundleGroup = 'com.ishland.c2me'
def c2meBundleArtifact = 'c2me-neoforge'
def patchC2me = tasks.register('patchC2me') {
    def c2meJar = configurations.c2meCompat
    inputs.files(c2meJar)
    inputs.property('removed', c2meRemovedModules.join(','))
    def output = layout.buildDirectory.file('c2me/c2me-patched.jar')
    outputs.file(output)
    doLast {
        def source = c2meJar.singleFile
        def target = output.get().asFile
        target.parentFile.mkdirs()
        if (c2meRemovedModules.isEmpty()) {
            java.nio.file.Files.copy(source.toPath(), target.toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            logger.lifecycle("c2me bundled unmodified")
            return
        }
        def found = new HashSet<String>()
        def put = { out, name, bytes ->
            out.putNextEntry(new java.util.zip.ZipEntry(name))
            out.write(bytes)
            out.closeEntry()
        }
        new java.util.zip.ZipFile(source).withCloseable { zip ->
            new java.util.zip.ZipOutputStream(new FileOutputStream(target)).withCloseable { out ->
                def entries = zip.entries()
                while (entries.hasMoreElements()) {
                    def entry = entries.nextElement()
                    def name = entry.name
                    if (name == 'META-INF/jarjar/metadata.json') {
                        def json = new groovy.json.JsonSlurper().parse(zip.getInputStream(entry))
                        def kept = []
                        json.jars.each { jar ->
                            def artifact = jar.identifier.artifact
                            if (c2meRemovedModules.contains(artifact)) {
                                found.add(artifact)
                            } else {
                                kept.add(jar)
                            }
                        }
                        json.jars = kept
                        put(out, name, groovy.json.JsonOutput.toJson(json).getBytes('UTF-8'))
                    } else if (name.startsWith('META-INF/jars/')
                        && c2meRemovedModules.any { name.contains(it.replace('c2me-', '')) }) {
                        found.add(c2meRemovedModules.find { name.contains(it.replace('c2me-', '')) })
                    } else {
                        put(out, name, zip.getInputStream(entry).bytes)
                    }
                }
            }
        }
        def missing = c2meRemovedModules - found
        if (!missing.isEmpty()) {
            throw new GradleException("c2me jar did not contain ${missing}, update the patch list")
        }
        logger.lifecycle("c2me patched without ${c2meRemovedModules}")
    }
}

// 手写 JarJar 元数据，避免 ModDevGradle 的 jarJar 配置在配置期就去解析本地补丁 jar
def c2meJarJarMetadata = tasks.register('generateC2meJarJarMetadata') {
    def output = layout.buildDirectory.file('c2me/META-INF/jarjar/metadata.json')
    outputs.file(output)
    doLast {
        def file = output.get().asFile
        file.parentFile.mkdirs()
        def payload = """{
  "jars": [
    {
      "identifier": {
        "group": "${c2meBundleGroup}",
        "artifact": "${c2meBundleArtifact}"
      },
      "version": {
        "range": "[${c2meBundleVersion},)",
        "artifactVersion": "${c2meBundleVersion}"
      },
      "path": "META-INF/jars/${c2meBundleArtifact}-${c2meBundleVersion}.jar"
    }
  ]
}
"""
        file.setText(payload, 'UTF-8')
    }
}

// 两个前置模组都用 compileOnly 加 runtimeOnly：
// compileOnly 供编译，runtimeOnly 让 runClient runServer runData 这些开发运行也加载它们
// 它们都是普通模组，运行时必须装在游戏端，jar 不会被打进本模组的产物
dependencies {
    // c2me 本体打进 jar，先去掉会改地形的两个模块；外部安装时由 FML 的 JarJar 协商处理
    c2meCompat "maven.modrinth:c2me-neoforge:${c2me_version}"

    // 4.9.3 是 1.21.1 线上当前的版本，它声明 neoforge >= 21.1.150，本项目满足
    // GeckoLib 另有一个 geckoanimfix 是 incompatible 依赖，两者不能同时装
    compileOnly "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
    runtimeOnly "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"

    // 坐标是「项目 id 加 file id」，7797302 对应 CurseForge 上 1.21.1 的 4.8.3345
    compileOnly 'curse.maven:the-twilight-forest-227639:7797302'
    runtimeOnly 'curse.maven:the-twilight-forest-227639:7797302'

    clientDevMods "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    clientDevMods "xaero.minimap:xaerominimap-neoforge-${minecraft_version}:${xaero_minimap_version}"
    clientDevMods "xaero.map:xaeroworldmap-neoforge-${minecraft_version}:${xaero_worldmap_version}"
    // 拼音搜索只有 CurseMaven，9163765 对应 1.21.1 的 4.5.30
    clientDevMods 'curse.maven:just-enough-characters-250702:9163765'

    // OpenYSM 是 Yes Steve Model 的开源分支，装进 runClient 是为了拿原始 Bedrock 动画对拍高塔恶魂的 GeckoLib 移植
    // 1.21.1 NeoForge 没有官方构建（官方的 CurseMaven 项目只发 1.20.1），只有第三方移植：CurseForge 项目 1587175
    // 8384243 对应 openysm-neoforge-1.21.1-2.6.6
    clientDevMods "curse.maven:openysm-unofficial-neoforge-port-1587175:${openysm_version}"

    // MaFgLib 是 Tweakerge 的前置，Modrinth 的 pom 传递不出来，只能显式加
    clientDevMods "maven.modrinth:mafglib:${mafglib_version}"
    clientDevMods "maven.modrinth:tweakerge:${tweakerge_version}"
    clientDevMods "maven.modrinth:jade:${jade_version}"
    // Chunky 的 1.4.23 在 Modrinth 上是 fabric forge neoforge 三条同版本号的文件，按版本号取会拿到 forge 那个
    // （FML 打日志 Skipping jar ... is for Minecraft Forge ... cannot be loaded 然后静默跳过）
    // 所以这里写 neoforge 那条的版本 id，对应 Chunky-NeoForge-1.4.23.jar
    clientDevMods "maven.modrinth:chunky:${chunky_version}"
    clientDevMods "maven.modrinth:zume:${zume_version}"
    // AppleSkin 看饱食度与食物回复，BoccHUD 看状态条，都是开发时看一眼的东西
    // BoccHUD 0.4.1 的必装前置就是 MaFgLib，不需要另写一条
    clientDevMods "maven.modrinth:appleskin:${appleskin_version}"
    clientDevMods "maven.modrinth:bocchud:${bocchud_version}"
}

// 把打过补丁的 c2me 作为嵌套 jar 打进产物，元数据手写
tasks.named('jar', Jar) {
    dependsOn patchC2me, c2meJarJarMetadata
    from(patchC2me) {
        into 'META-INF/jars'
        rename { "${c2meBundleArtifact}-${c2meBundleVersion}.jar" }
    }
    from(c2meJarJarMetadata) {
        into 'META-INF/jarjar'
    }
}

// run 的 classpath 在任务执行时才从 classpathProvider 取，所以要加在 provider 上，加 classpath 会被覆盖
tasks.named('runClient') { task ->
    task.classpathProvider.from(configurations.clientDevMods)
}

def twilightDependency = providers.gradleProperty('twilight_dependency').getOrElse('required')

def replaceProperties = [
    minecraft_version      : minecraft_version,
    minecraft_version_range: minecraft_version_range,
    neo_version            : neo_version,
    neo_version_range      : neo_version_range,
    loader_version_range   : loader_version_range,
    mod_id                 : mod_id,
    mod_name               : mod_name,
    mod_license            : mod_license,
    mod_version            : mod_version,
    mod_authors            : mod_authors,
    mod_description        : mod_description,
    twilight_dependency    : twilightDependency,
]

tasks.named('processResources', ProcessResources).configure {
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs << '-Xlint:deprecation'
}

jar {
    manifest {
        attributes([
            'Specification-Title'   : mod_id,
            'Specification-Vendor'  : mod_authors,
            'Specification-Version' : '1',
            'Implementation-Title'  : mod_name,
            'Implementation-Version': mod_version,
            'Implementation-Vendor' : mod_authors,
        ])
    }
}

// 可选的 native 顶点变换内核
// 找不到编译器就跳过，jar 里没有库时 NativeVertex 会走纯 Java 路径，构建不会因此失败
//
// 默认按构建机编译。交叉编译时传：
//   -PddtNativeTarget=linux-aarch64
//   -PddtNativeCompiler=aarch64-linux-gnu-g++
//   -PddtNativeFlags="-arch x86_64"
// 产物落在 build/native/<os>-<arch>/，processResources 会把 build/native 下所有平台一起打进 jar
def nativeOsName = System.getProperty('os.name', '').toLowerCase(Locale.ROOT)
def nativeArchName = System.getProperty('os.arch', '').toLowerCase(Locale.ROOT)
def nativeHostOs = nativeOsName.contains('win') ? 'windows' : (nativeOsName.contains('mac') ? 'macos' : 'linux')
def nativeHostArch = (nativeArchName.contains('aarch64') || nativeArchName.contains('arm64')) ? 'aarch64'
    : (nativeArchName.contains('64') ? 'x86_64' : 'x86')

def nativeTarget = providers.gradleProperty('ddtNativeTarget').getOrElse("${nativeHostOs}-${nativeHostArch}")
def nativeTargetParts = nativeTarget.split('-')
def nativeTargetOs = nativeTargetParts[0]
def nativeTargetArch = nativeTargetParts.length > 1 ? nativeTargetParts[1] : nativeHostArch
def nativeKey = "${nativeTargetOs}-${nativeTargetArch}"
def nativeLibraryName = nativeTargetOs == 'windows' ? 'ddt_vertex.dll'
    : (nativeTargetOs == 'macos' ? 'ddt_vertex.dylib' : 'ddt_vertex.so')
def nativeCompiler = providers.gradleProperty('ddtNativeCompiler')
    .getOrElse(nativeTargetOs == 'windows' ? 'g++' : 'c++')
def nativeExtraFlags = providers.gradleProperty('ddtNativeFlags').getOrElse('')
    .split(' ').findAll { !it.isBlank() }
def nativeOutput = layout.buildDirectory.dir("native/${nativeKey}")
def javaHome = System.getProperty('java.home')
def jniPlatform = nativeTargetOs == 'windows' ? 'win32' : (nativeTargetOs == 'macos' ? 'darwin' : 'linux')

def nativeCompilerAvailable = {
    try {
        def process = new ProcessBuilder(nativeCompiler, '--version')
            .redirectErrorStream(true)
            .start()
        process.inputStream.close()
        return process.waitFor() == 0
    } catch (Exception ignored) {
        return false
    }
}

def nativeArguments = ['-O3', '-std=c++17'] + nativeExtraFlags
if (nativeTargetOs == 'windows') {
    // -static 把 libwinpthread 与 gcc/stdc++ 运行库一起塞进 DLL 玩家机器上没有 MinGW 的 DLL
    nativeArguments += ['-shared', '-pthread', '-static']
} else if (nativeTargetOs == 'macos') {
    nativeArguments += ['-dynamiclib', '-pthread']
} else {
    nativeArguments += ['-shared', '-fPIC', '-pthread', '-static-libgcc', '-static-libstdc++']
}

def buildNative = tasks.register('buildNative', Exec) {
    onlyIf { nativeCompilerAvailable() }
    inputs.file layout.projectDirectory.file('src/main/native/ddt_vertex.cpp')
    inputs.property('target', nativeKey)
    inputs.property('compiler', nativeCompiler)
    inputs.property('flags', nativeExtraFlags.join(' '))
    outputs.dir nativeOutput
    doFirst {
        nativeOutput.get().asFile.mkdirs()
    }
    commandLine([nativeCompiler] + nativeArguments + [
        "-I${javaHome}/include".toString(),
        "-I${javaHome}/include/${jniPlatform}".toString(),
        layout.projectDirectory.file('src/main/native/ddt_vertex.cpp').asFile.absolutePath,
        '-o',
        new File(nativeOutput.get().asFile, nativeLibraryName).absolutePath
    ])
}

// build/native 下已经有交叉编译产物的目录也一起打包，CI 先跑矩阵再把产物落到这里
processResources {
    dependsOn buildNative
    from(layout.buildDirectory.dir('native')) {
        into 'native'
        includeEmptyDirs = false
    }
}
