name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  natives:
    name: native ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows 的 DLL 直接在 Ubuntu 上交叉编译 省掉 Windows runner 的 MinGW 环境问题
          - os: ubuntu-latest
            target: windows-x86_64
            compiler: x86_64-w64-mingw32-g++
            flags: ''
            apt: g++-mingw-w64-x86-64
          - os: ubuntu-latest
            target: linux-x86_64
            compiler: g++
            flags: ''
          - os: ubuntu-latest
            target: linux-aarch64
            compiler: aarch64-linux-gnu-g++
            flags: ''
            apt: g++-aarch64-linux-gnu
          - os: macos-14
            target: macos-aarch64
            compiler: c++
            flags: ''
          - os: macos-14
            target: macos-x86_64
            compiler: c++
            flags: '-arch x86_64'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install cross compiler
        if: matrix.apt
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt }}
      - name: Build native
        env:
          DDT_TARGET: ${{ matrix.target }}
          DDT_COMPILER: ${{ matrix.compiler }}
          DDT_FLAGS: ${{ matrix.flags }}
        run: |
          ./gradlew buildNative \
            -PddtNativeTarget="$DDT_TARGET" \
            -PddtNativeCompiler="$DDT_COMPILER" \
            -PddtNativeFlags="$DDT_FLAGS" \
            --no-daemon --stacktrace
      - name: Upload native
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.target }}
          path: build/native
          if-no-files-found: error

  build:
    needs: natives
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Download natives
        uses: actions/download-artifact@v7
        with:
          pattern: native-*
          path: build/native
          merge-multiple: true
      - name: Check tag matches mod_version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          declared=$(grep -E '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          if [ "v${declared}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match mod_version v${declared} in gradle.properties"
            exit 1
          fi
      - name: Build
        run: ./gradlew build --no-daemon --stacktrace
      - name: Verify natives in jar
        run: |
          set -e
          jar_file=$(ls build/libs/*.jar)
          for key in windows-x86_64 linux-x86_64 linux-aarch64 macos-x86_64 macos-aarch64; do
            case "$key" in
              windows-*) lib=ddt_vertex.dll ;;
              macos-*) lib=ddt_vertex.dylib ;;
              *) lib=ddt_vertex.so ;;
            esac
            unzip -l "$jar_file" | grep -q "native/$key/$lib" || {
              echo "missing native/$key/$lib in $jar_file"
              exit 1
            }
          done
          unzip -l "$jar_file" | grep -E 'native/.*/ddt_vertex\.(dll|so|dylib)$'
          unzip -l "$jar_file" | grep -q 'META-INF/jars/c2me-neoforge-.*\.jar' || {
            echo "missing bundled c2me in $jar_file"
            exit 1
          }
          unzip -p "$jar_file" META-INF/jarjar/metadata.json | grep -q '"artifact": "c2me-neoforge"' || {
            echo "missing c2me jarjar metadata in $jar_file"
            exit 1
          }
      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: dawnduskterminal-jar
          path: build/libs/*.jar
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download jar
        uses: actions/download-artifact@v7
        with:
          name: dawnduskterminal-jar
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.jar --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" dist/*.jar \
              --title "$GITHUB_REF_NAME" --generate-notes --repo "$GITHUB_REPOSITORY"
          fi
