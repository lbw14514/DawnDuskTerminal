name: GameTest

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: gametest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gametest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run game tests
        run: ./gradlew runGameTestServer --no-daemon --stacktrace
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-log
          path: run/gametest/logs/
          if-no-files-found: ignore
